spring.application.name=distributed-wallet-ledger-system

# MySQL - connects directly using root; database is auto-created on first run.
spring.datasource.url=jdbc:mysql://localhost:3306/wallet_ledger_db?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.port=8080

# Kafka - single local broker via docker-compose.yml (port 9094, not the
# default 9092, to avoid conflicting with another project's Kafka container)
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Redis - single local instance via docker-compose.yml (port 6380, not the
# default 6379, to avoid conflicting with another project's Redis container)
spring.data.redis.host=localhost
spring.data.redis.port=6380
